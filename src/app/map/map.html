<div #map class="h-dvh" [cdkContextMenuTriggerFor]="mapContextMenu" (contextmenu)="$event.preventDefault(); this.contextMenuPosition.set($event);"></div>

<ng-template #mapContextMenu>
    <app-map-context-menu [marker]="this.contextMenuMarker()" [onEdit]="x => this.openMarkerDialog(x)" [onRemove]="x => this.removeMarker(x)" />
</ng-template>



<!-- Map controls -->
<div class="absolute z-500 top-2 left-2 bottom-2 sm:top-6 sm:left-6 sm:bottom-6 pointer-events-none">
  <div appPanel class="p-2 flex flex-col max-h-full overflow-scroll pointer-events-auto">

    <!-- Zoom -->
    <button appIconButton2="plus" (click)="this.zoom('in')"></button>
    <button appIconButton2="minus" (click)="this.zoom('out')"></button>

    <app-divider />

    <!-- Geolocation -->
    <button appIconButton2="gps-location" (click)="this.setGeolocationMarker()" appTooltip="Add marker at current location"></button>

    <!-- Refresh -->
    <button appIconButton2 (click)="this.triggerTimer()" [disabled]="this.isLoading()" appTooltip="Refresh radar">
      <app-icon icon="arrow-path" [class.motion-safe:animate-spin-half]="this.isSpinning()" (animationiteration)="this.onSpinIteration()" />
    </button>

    <app-divider />

    <!-- Settings -->
    <button appIconButton2="cog" (click)="this.openSettingsDialog()" appTooltip="Settings"></button>

    <app-divider />

    <!-- Opacity -->
    <button appIconButton2 (click)="this.isOpacityOpen.update(x => !x)" appTooltip="Toggle opacity control">
      <app-icon icon="adjust-vertical" class="ease-out motion-safe:transition-[rotate]" [class.rotate-90]="this.isOpacityOpen()" />
    </button>

    @if (this.isOpacityOpen()) {
      <div class="py-3 h-80 min-h-24 overflow-hidden" animate.enter="motion-safe:animate-expand-height" animate.leave="motion-safe:animate-collapse-height" appTooltip="Radar opacity">
        <app-slider vertical [(value)]="this.opacity" [max]="1" step="0.01" />
      </div>
    }
  </div>

</div>


@if (this.currentRadarImage()?.radarImage?.date; as date) {
  <!-- Time information -->
  <div appPanel class="absolute top-2 sm:top-6 left-1/2 transform -translate-x-1/2 z-500 w-52 py-2 text-center" animate.enter="motion-safe:animate-slide-in-top">
    <div class="font-mono font-semibold text-2xl text-color-text-accent">
      {{ date | date: 'HH:mm' }}
    </div>
    <div class="w-full text-xs">
      <span>{{ date | date: 'E, d. MMM' }}</span>
      <span class="mx-1">·</span>
      <span>Updated {{ this.refreshedAt() | date: 'HH:mm' }}</span>
    </div>
  </div>


  <!-- Slider -->
  <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-500 px-4 w-full max-w-xl">
    <div appPanel class="px-6 py-4" animate.enter="motion-safe:animate-slide-in-bottom">
      @let images = this.radarImages();
      <app-slider [max]="images.length - 1" [(value)]="this.slider" />
    </div>
  </div>
}
